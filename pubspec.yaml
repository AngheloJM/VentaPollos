name: venta_pollos
description: App de punto de venta para pollería con impresión de comandas.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Estado
  provider: ^6.1.2

  # Base de datos local (Android / iOS)
  sqflite: ^2.4.1
  path: ^1.9.0

  # UI y formato
  google_fonts: ^6.2.1
  intl: ^0.20.2

  # Impresión térmica ESC/POS
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
